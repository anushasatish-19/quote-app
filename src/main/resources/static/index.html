<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Quotes</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
        }

        #quote-display {
            font-style: italic;
            font-size: 1.2rem;
            color: #555;
            margin: 20px 0;
            min-height: 50px;
        }

        button {
            background-color: #4facfe;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00f2fe;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Today's Inspiration</h1>
    <div id="quote-display">Loading a quote...</div>
    <button onclick="getRandomQuote()">New Quote</button>
</div>

<script>
    let quotes = [];

    async function loadQuotes() {
        try {
            const response = await fetch('/quotes');
            quotes = await response.json();
            getRandomQuote();
        } catch (error) {
            document.getElementById('quote-display').innerText = "Failed to load quotes.";
            console.error("Error fetching quotes:", error);
        }
    }

    function getRandomQuote() {
        if (quotes.length > 0) {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote-display').innerText =
                `"${quotes[randomIndex]}"`;
        } else {
            document.getElementById('quote-display').innerText =
                "No quotes available.";
        }
    }

    // Load quotes when page opens
    loadQuotes();
</script>

</body>
</html>
